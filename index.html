<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training</title>
<link rel="apple-touch-icon" href="./icon.png">
<style>
  :root{
    --bg:#0F1115;
    --surface:#171A20;
    --surface-2:#1F232B;
    --line:#2A2F38;
    --text:#EDEDEF;
    --text-dim:#8A8F98;
    --accent:#E8A33D;
    --accent-dim:#5A4426;
    --success:#5FBE7A;
    --danger:#E2574C;
    --radius:6px;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header.topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:22px 20px 14px; position:sticky; top:0; background:linear-gradient(var(--bg) 80%, transparent); z-index:5;
  }
  header.topbar h1{
    font-size:15px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; margin:0; color:var(--text-dim);
  }
  .streak{font-family:var(--mono); font-size:13px; color:var(--accent);}
  main{flex:1; padding:0 16px 100px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:14px;
  }
  .card h2{margin:0 0 4px; font-size:19px; font-weight:700;}
  .card h2.cardlabel{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .card .sub{color:var(--text-dim); font-size:13px; margin-bottom:14px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#1a1206; border:none; border-radius:var(--radius);
    font-weight:700; font-size:15px; padding:13px 18px; cursor:pointer; width:100%;
    font-family:var(--sans);
  }
  .btn:active{opacity:.8;}
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
  .btn.danger{background:var(--danger); color:#fff;}
  .weekgrid{display:flex; gap:5px; margin-top:10px;}
  .weekgrid .slot{
    flex:1; height:56px; border-radius:var(--radius); background:var(--surface-2);
    border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-dim); gap:3px;
  }
  .weekgrid .slot .big{font-weight:800; font-size:15px;}
  .weekgrid .slot .small{font-size:9px; letter-spacing:.05em; text-transform:uppercase;}
  .weekgrid .slot.done{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}
  .weekgrid .slot.today{box-shadow:0 0 0 1.5px var(--accent) inset; color:var(--text);}
  .weekgrid .slot.today.done{color:var(--accent);}
  .weekgrid .slot.future{opacity:.45;}
  .cardiostatus{font-size:12px; color:var(--text-dim); margin-top:10px;}
  .cardiostatus .ok{color:var(--success);}
  .splitrow{display:flex; justify-content:space-between; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line);}
  .splitrow:last-child{border-bottom:none;}
  .splitrow .d{color:var(--text-dim);}
  .vol-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px;}
  .vol-label{width:66px; color:var(--text-dim); flex-shrink:0;}
  .vol-bar-bg{flex:1; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .vol-bar-fill{height:100%; background:var(--accent); border-radius:4px;}
  .vol-count{width:44px; text-align:right; font-family:var(--mono); color:var(--text-dim); flex-shrink:0;}
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;
    background:rgba(15,17,21,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom); z-index:10;
  }
  nav.tabbar .inner{max-width:520px; width:100%; display:flex;}
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim); font-family:var(--sans);
    font-size:11px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .icon{font-size:19px; line-height:1;}
  .exwrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .exwrap .exname{font-weight:700; font-size:16px;}
  .exwrap .exmeta{color:var(--text-dim); font-size:12px; margin-top:2px; margin-bottom:12px;}
  .setrow{display:grid; grid-template-columns:26px 1fr 1fr 34px; gap:8px; align-items:center; margin-bottom:8px;}
  .setrow.single{grid-template-columns:26px 1fr 34px;}
  .setrow .setnum{font-family:var(--mono); color:var(--text-dim); font-size:13px;}
  .setrow input{
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px; color:var(--text);
    font-family:var(--mono); font-size:15px; padding:9px 6px; width:100%; text-align:center;
  }
  .setrow input::placeholder{color:#4a4f58;}
  .checkbtn{
    width:34px; height:34px; border-radius:4px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .checkbtn.checked{background:var(--success); border-color:var(--success); color:#0a1a0e;}
  .lastnote{font-size:11px; color:var(--text-dim); margin-bottom:8px; font-family:var(--mono);}
  .timerwrap{display:flex; align-items:center; gap:14px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px;}
  .timerwrap svg{flex-shrink:0;}
  .timerwrap .ttext{font-family:var(--mono); font-size:22px; font-weight:700;}
  .timerwrap .tlabel{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em;}
  .chiprow{display:flex; gap:8px; margin-top:8px;}
  .chip{background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); font-family:var(--mono); font-size:12px; padding:6px 10px; border-radius:20px;}
  .examples{display:flex; flex-wrap:wrap; gap:5px; margin:2px 0 10px;}
  .ex-chip{background:transparent; border:1px solid var(--line); color:var(--text-dim); font-family:var(--sans); font-size:11px; padding:4px 9px; border-radius:12px; cursor:pointer;}
  .ex-chip:active{background:var(--accent-dim); color:var(--accent); border-color:var(--accent);}
  .histitem{border-bottom:1px solid var(--line); padding:12px 0;}
  .histitem:last-child{border-bottom:none;}
  .histitem .hd{display:flex; justify-content:space-between; font-size:14px; font-weight:600;}
  .histitem .hd .date{color:var(--text-dim); font-weight:400; font-family:var(--mono); font-size:12px;}
  .histitem .detail{font-size:12px; color:var(--text-dim); margin-top:4px; line-height:1.6;}
  .pbtable{width:100%; border-collapse:collapse; font-size:13px;}
  .pbtable td{padding:8px 4px; border-bottom:1px solid var(--line);}
  .pbtable td:last-child{text-align:right; font-family:var(--mono); color:var(--accent); white-space:nowrap;}
  select, input[type=text], input[type=number]{
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px; color:var(--text);
    font-family:var(--sans); font-size:15px; padding:11px; width:100%;
  }
  input.variantinput{font-size:13px; padding:8px 10px; margin:6px 0 4px; color:var(--text);}
  label.field{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; margin-top:14px;}
  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 10px;}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface-2);
    border:1px solid var(--accent); color:var(--text); padding:10px 18px; border-radius:20px; font-size:13px;
    z-index:20; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; text-align:center;
  }
  .toast.show{opacity:1;}
  .backlink{color:var(--text-dim); font-size:13px; margin-bottom:14px; display:inline-block;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATENMODELL ============ */
const STORAGE_KEY = "trainingsapp_v2";

/* Plan: Bewegungsmuster laut Vorlage. Gleiche IDs (z. B. lateral, biceps)
   verknüpfen dieselbe Übung über mehrere Einheiten hinweg für die Progression. */
const PLAN = {
  A: { name:'Ganzkörper A', exercises: [
    {id:'squat_var',    name:'Kniebeugevariation',            muscle:'Beine',    sets:3, repMin:6,  repMax:8,  unit:'kg', inc:2.5, type:'weight',
      examples:['Kniebeuge frei/Multipresse','Hack Squat','Pendulum Squat','Split Squat','Bulgarian Split Squat']},
    {id:'hpress',       name:'Horizontale Druckbewegung',     muscle:'Brust',    sets:3, repMin:6,  repMax:10, unit:'kg', inc:2.5, type:'weight',
      examples:['Bankdrücken LH','Bankdrücken KH','Bankdrücken Multipresse','Brustpresse Maschine','Cable Press']},
    {id:'vpull_wide',   name:'Vertikale Zugbewegung breit',   muscle:'Rücken',   sets:2, repMin:6,  repMax:10, unit:'kg', inc:2.5, type:'weight',
      examples:['Latziehen breit','Latzugmaschine breit','Klimmzüge breit']},
    {id:'hpull_wide',   name:'Horizontale Zugbewegung breit', muscle:'Rücken',   sets:2, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Rudern breit Kabelzug','Rudern breit KH','Rudern breit LH','Rudermaschine breit brustgestützt','T-Bar Rudern']},
    {id:'lateral',      name:'Seithebevariation',             muscle:'Schulter', sets:3, repMin:8,  repMax:12, unit:'kg', inc:1,   type:'weight',
      examples:['Seitheben KH','Seitheben Kabelzug','Seitheben Maschine']},
    {id:'legcurl',      name:'Beinbeuger Isolation',          muscle:'Beine',    sets:2, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Beinbeuger sitzend','Beinbeuger liegend']},
    {id:'biceps',       name:'Bizeps Isolation',              muscle:'Arme',     sets:2, repMin:6,  repMax:10, unit:'kg', inc:1,   type:'weight',
      examples:['Preacher Curls Maschine','Preacher Curls KH','Kurzhantelcurls stehend','Kurzhantelcurls sitzend','Curls am Kabelzug']}
  ]},
  B: { name:'Ganzkörper B', exercises: [
    {id:'deadlift_var', name:'Kreuzhebevariation',            muscle:'Rücken',   sets:3, repMin:5,  repMax:8,  unit:'kg', inc:5,   type:'weight',
      examples:['Konventionelles Kreuzheben','Rumänisches Kreuzheben','Stiff Leg Deadlift']},
    {id:'vpress',       name:'Vertikale Druckbewegung',       muscle:'Schulter', sets:3, repMin:6,  repMax:8,  unit:'kg', inc:2.5, type:'weight',
      examples:['Schulterdrücken KH','Schulterdrücken LH','Schulterdrücken Maschine']},
    {id:'legpress',     name:'Beinpresse Variation',          muscle:'Beine',    sets:2, repMin:6,  repMax:10, unit:'kg', inc:5,   type:'weight',
      examples:['Liegende Beinpresse','Sitzende Beinpresse','45°-Beinpresse','Einbeinige Beinpresse']},
    {id:'hpull_close',  name:'Horizontale Zugbewegung eng',   muscle:'Rücken',   sets:3, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Rudern eng Kabelzug','Rudern eng KH','Rudern eng LH','Rudermaschine eng brustgestützt']},
    {id:'fly',          name:'Flyvariante',                   muscle:'Brust',    sets:2, repMin:8,  repMax:12, unit:'kg', inc:1,   type:'weight',
      examples:['Fly am Kabelzug','Butterflymaschine','Fly mit Kurzhanteln']},
    {id:'reardelt',     name:'Hintere Schulter Isolation',    muscle:'Schulter', sets:2, repMin:8,  repMax:12, unit:'kg', inc:1,   type:'weight',
      examples:['Rear Delt Row','Reverse Butterfly am Kabelzug','Reverse Butterfly Maschine']},
    {id:'triceps',      name:'Trizeps Isolation',             muscle:'Arme',     sets:3, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Trizepsdrücken Überkopf Kabel','Trizepsdrücken Überkopf KH','Pushdowns am Seil','Katana Extensions','French Press','Skull Crusher']}
  ]},
  C: { name:'Ganzkörper C', exercises: [
    {id:'incline',      name:'Schrägbankvariante',            muscle:'Brust',    sets:3, repMin:6,  repMax:8,  unit:'kg', inc:2.5, type:'weight',
      examples:['Schrägbankdrücken LH','Schrägbankdrücken KH','Schrägbankdrücken Maschine']},
    {id:'vpull_close',  name:'Vertikale Zugbewegung eng',     muscle:'Rücken',   sets:3, repMin:6,  repMax:10, unit:'kg', inc:2.5, type:'weight',
      examples:['Chin Ups','Latziehen eng','Latzugmaschine eng','High Row mit engem Griff']},
    {id:'legext',       name:'Beinstrecker',                  muscle:'Beine',    sets:2, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Beinstrecker Maschine']},
    {id:'lateral',      name:'Seithebevariation',             muscle:'Schulter', sets:3, repMin:10, repMax:12, unit:'kg', inc:1,   type:'weight',
      examples:['Seitheben KH','Seitheben Kabelzug','Seitheben Maschine']},
    {id:'biceps',       name:'Bizeps Isolation',              muscle:'Arme',     sets:2, repMin:8,  repMax:12, unit:'kg', inc:1,   type:'weight',
      examples:['Preacher Curls Maschine','Preacher Curls KH','Kurzhantelcurls stehend','Kurzhantelcurls sitzend','Curls am Kabelzug']},
    {id:'calves',       name:'Waden Isolation',               muscle:'Waden',    sets:3, repMin:8,  repMax:12, unit:'kg', inc:2.5, type:'weight',
      examples:['Wadenheben stehend','Wadenheben sitzend']},
    {id:'abs',          name:'Bauch Isolation',               muscle:'Core',     sets:3, repMin:6,  repMax:10, unit:'kg', inc:2.5, type:'weight',
      examples:['Cable Crunch','Crunches an der Maschine','Hanging Leg Raise','Ab Wheel']}
  ]}
};
const PLAN_ORDER = ['A','B','C'];
/* 7-Tage-Zyklus laut Vorlage: Tag 1 = A, Tag 4 = B, Tag 6 = C, Rest = Restdays */
const SCHEDULE = {1:'A', 2:null, 3:null, 4:'B', 5:null, 6:'C', 7:null};
const MUSCLES = ['Beine','Brust','Rücken','Schulter','Arme','Waden','Core'];

function loadData(){
  const def = { sessions: [], cardioSessions: [], cycleStart: null, variants: {} };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return Object.assign(def, JSON.parse(raw)); }
  }catch(e){ console.error("Ladefehler", e); }
  return def;
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
}
let DATA = loadData();

/* ============ HELFER ============ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function localISO(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function todayISO(){ return localISO(new Date()); }
function addDays(iso, n){
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return localISO(d);
}
function dayDiff(aISO, bISO){
  const a = new Date(aISO + "T12:00:00"), b = new Date(bISO + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
}
function weekdayShort(iso){
  return ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(iso + "T12:00:00").getDay()];
}

/* Zyklus: Tag 1 = Tag des ersten abgeschlossenen Trainings (bzw. nach Neustart). */
function cycleInfo(){
  if(!DATA.cycleStart) return null;
  const d = Math.max(0, dayDiff(DATA.cycleStart, todayISO()));
  const day = (d % 7) + 1;
  const cycleIdx = Math.floor(d / 7);
  const curStart = addDays(DATA.cycleStart, cycleIdx * 7);
  return { day, cycleIdx, curStart };
}
function sessionsInCycle(startISO){
  const end = addDays(startISO, 7);
  return {
    s: DATA.sessions.filter(x => x.date >= startISO && x.date < end),
    c: DATA.cardioSessions.filter(x => x.date >= startISO && x.date < end)
  };
}
function streakCycles(){
  const info = cycleInfo();
  if(!info) return 0;
  let streak = 0;
  for(let k = info.cycleIdx; k >= 0; k--){
    const start = addDays(DATA.cycleStart, k * 7);
    const {s, c} = sessionsInCycle(start);
    const full = s.length >= 3 && c.length >= 1;
    if(full){ streak++; }
    else if(k === info.cycleIdx){ /* laufender Zyklus zählt noch nicht als Bruch */ }
    else break;
  }
  return streak;
}
function planTargets(){
  const t = {}; MUSCLES.forEach(m => t[m] = 0);
  PLAN_ORDER.forEach(v => PLAN[v].exercises.forEach(ex => { t[ex.muscle] += ex.sets; }));
  return t;
}
function cycleVolume(info){
  const cyc = sessionsInCycle(info.curStart);
  const vol = {}; MUSCLES.forEach(m => vol[m] = 0);
  cyc.s.forEach(s => s.exercises.forEach(ex => {
    const done = ex.sets.filter(st => st.done).length;
    if(vol[ex.muscle] != null) vol[ex.muscle] += done;
  }));
  return vol;
}
function lastSessionFor(exerciseId){
  for(let i = DATA.sessions.length - 1; i >= 0; i--){
    const s = DATA.sessions[i];
    const ex = s.exercises.find(e => e.id === exerciseId);
    if(ex && ex.sets.some(st => st.done)) return {session: s, ex};
  }
  return null;
}
function suggestWeight(exDef){
  const last = lastSessionFor(exDef.id);
  if(!last) return null;
  const varTxt = last.ex.variant ? ` (${esc(last.ex.variant)})` : '';
  if(exDef.type === 'weight'){
    const doneSets = last.ex.sets.filter(s => s.done && s.weight != null && s.reps != null);
    if(doneSets.length === 0) return null;
    const allTop = doneSets.length >= exDef.sets && doneSets.every(s => s.reps >= exDef.repMax);
    const maxWeight = Math.max(...doneSets.map(s => s.weight));
    if(allTop && exDef.inc > 0) return {weight: Math.round((maxWeight + exDef.inc) * 100) / 100, note:`Letztes Mal${varTxt}: ${maxWeight} kg × ${exDef.repMax}+. Steigerung empfohlen.`};
    return {weight: maxWeight, note:`Letztes Mal${varTxt}: ${maxWeight} kg — Ziel: ${exDef.repMax} Wdh. in jedem Satz.`};
  } else {
    const doneSets = last.ex.sets.filter(s => s.done && s.reps != null);
    if(doneSets.length === 0) return null;
    const maxVal = Math.max(...doneSets.map(s => s.reps));
    return {weight:null, note:`Letztes Mal${varTxt}: ${maxVal} ${exDef.unit} — Ziel: ${exDef.repMax}+ in jedem Satz.`};
  }
}
function epley1RM(weight, reps){
  return Math.round(weight * (1 + reps/30) * 10) / 10;
}
function personalBests(){
  const pbs = {};
  DATA.sessions.forEach(s => {
    s.exercises.forEach(ex => {
      const isWeight = ex.type ? ex.type === 'weight' : true;
      ex.sets.forEach(st => {
        if(!st.done) return;
        if(isWeight){
          if(st.weight == null || st.reps == null) return;
          const e1rm = epley1RM(st.weight, st.reps);
          if(!pbs[ex.id] || e1rm > pbs[ex.id].value){
            pbs[ex.id] = {value: e1rm, display: `${e1rm} kg (e1RM)`, sub: `${st.weight} kg × ${st.reps}`, name: ex.name, date: s.date};
          }
        } else {
          if(st.reps == null) return;
          if(!pbs[ex.id] || st.reps > pbs[ex.id].value){
            pbs[ex.id] = {value: st.reps, display: `${st.reps} ${ex.unit}`, sub: '', name: ex.name, date: s.date};
          }
        }
      });
    });
  });
  return pbs;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============ STATE / ROUTING ============ */
let VIEW = 'home';
let ACTIVE = null;
let TIMER = { running:false, remaining:0, total:0, handle:null };

function setView(v){ VIEW = v; render(); }

/* ============ WORKOUT SESSION ============ */
function startWorkout(variant){
  const def = PLAN[variant];
  if(!def) return;
  ACTIVE = {
    variant, name: def.name, date: todayISO(),
    exercises: def.exercises.map(ex => {
      const sugg = suggestWeight(ex);
      return {
        id: ex.id, name: ex.name, muscle: ex.muscle, unit: ex.unit, type: ex.type,
        repMin: ex.repMin, repMax: ex.repMax, inc: ex.inc,
        examples: ex.examples || [],
        variant: DATA.variants[ex.id] || '',
        suggestNote: sugg ? sugg.note : 'Erster Eintrag — trag deine Variante und dein Startgewicht ein.',
        sets: Array.from({length: ex.sets}, () => ({weight: (ex.type === 'weight' && sugg) ? sugg.weight : null, reps: null, done: false}))
      };
    })
  };
  setView('workout');
}
function startCardio(){
  ACTIVE = { cardio:true, date: todayISO(), type:'Laufen', duration:30, distance:'', rpe:5 };
  setView('cardio');
}
function finishWorkout(){
  const hasAnySet = ACTIVE.exercises.some(ex => ex.sets.some(s => s.done));
  if(!hasAnySet){ toast('Trag mindestens einen Satz ein, bevor du abschließt.'); return; }
  ACTIVE.exercises.forEach(ex => { if(ex.variant) DATA.variants[ex.id] = ex.variant; });
  DATA.sessions.push({ date: ACTIVE.date, variant: ACTIVE.variant, name: ACTIVE.name, exercises: ACTIVE.exercises });
  if(!DATA.cycleStart) DATA.cycleStart = ACTIVE.date;
  saveData();
  stopTimer();
  ACTIVE = null;
  setView('home');
  toast('Training gespeichert 💪');
}
function finishCardio(){
  DATA.cardioSessions.push({ date: ACTIVE.date, type: ACTIVE.type, duration: ACTIVE.duration, distance: ACTIVE.distance, rpe: ACTIVE.rpe });
  saveData();
  ACTIVE = null;
  setView('home');
  toast('Ausdauereinheit gespeichert');
}
function cancelActive(){
  if(confirm('Aktuelle Einheit verwerfen?')){ ACTIVE = null; stopTimer(); setView('home'); }
}

/* ============ REST TIMER ============ */
function startTimer(seconds){
  stopTimer();
  TIMER = {running:true, remaining:seconds, total:seconds, handle:null};
  TIMER.handle = setInterval(() => {
    TIMER.remaining--;
    if(TIMER.remaining <= 0){
      stopTimer();
      beep();
      toast('Pause vorbei!');
    }
    renderTimerOnly();
  }, 1000);
  render();
}
function stopTimer(){
  if(TIMER.handle) clearInterval(TIMER.handle);
  TIMER = {running:false, remaining:0, total:0, handle:null};
}
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(() => {o.stop(); ctx.close();}, 350);
  }catch(e){}
}
function renderTimerOnly(){
  const el = document.getElementById('timerText');
  const ring = document.getElementById('timerRing');
  if(!el || !ring) return;
  const mm = Math.floor(TIMER.remaining/60), ss = TIMER.remaining%60;
  el.textContent = `${mm}:${String(ss).padStart(2,'0')}`;
  const pct = TIMER.total > 0 ? TIMER.remaining/TIMER.total : 0;
  const circ = 2*Math.PI*26;
  ring.style.strokeDashoffset = circ*(1-pct);
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(ACTIVE && ACTIVE.cardio) body = renderCardioView();
  else if(ACTIVE) body = renderWorkoutView();
  else if(VIEW === 'home') body = renderHome();
  else if(VIEW === 'history') body = renderHistory();
  else if(VIEW === 'progress') body = renderProgress();
  else if(VIEW === 'data') body = renderDataView();

  app.innerHTML = `
    <header class="topbar">
      <h1>Trainingsplan</h1>
      <div class="streak">🔥 ${streakCycles()} Zyklen</div>
    </header>
    <main>${body}</main>
    ${ACTIVE ? '' : renderTabbar()}
  `;
  attachHandlers();
  if(TIMER.total > 0) renderTimerOnly();
}

function renderTabbar(){
  const tabs = [
    {id:'home', icon:'🏠', label:'Heute'},
    {id:'history', icon:'📜', label:'Verlauf'},
    {id:'progress', icon:'📈', label:'Fortschritt'},
    {id:'data', icon:'⚙️', label:'Daten'}
  ];
  return `<nav class="tabbar"><div class="inner">
    ${tabs.map(t => `<button data-tab="${t.id}" class="${VIEW === t.id ? 'active' : ''}">
      <span class="icon">${t.icon}</span>${t.label}
    </button>`).join('')}
  </div></nav>`;
}

function renderOnboarding(){
  return `
    <div class="card">
      <h2>${PLAN.A.name}</h2>
      <div class="sub">Der Tag, an dem du dein erstes Training abschließt, wird automatisch <b>Tag 1</b> deines 7-Tage-Zyklus.</div>
      <button class="btn" data-action="start-workout" data-variant="A">Training starten</button>
      <div style="height:8px"></div>
      <button class="btn secondary" data-action="start-cardio">Ausdauer loggen</button>
    </div>
    <div class="card">
      <h2 class="cardlabel">Der Split</h2>
      ${[1,2,3,4,5,6,7].map(d => `<div class="splitrow"><span class="d">Tag ${d}</span><span>${SCHEDULE[d] ? PLAN[SCHEDULE[d]].name : 'Restday'}</span></div>`).join('')}
    </div>
  `;
}

function renderHome(){
  const info = cycleInfo();
  if(!info) return renderOnboarding();
  const cyc = sessionsInCycle(info.curStart);
  const doneVariants = new Set(cyc.s.map(x => x.variant));
  const scheduled = SCHEDULE[info.day];
  const doneTodayStrength = cyc.s.some(x => x.date === todayISO());
  const nextDue = PLAN_ORDER.find(v => !doneVariants.has(v)) || null;
  const cardioDone = cyc.c.length > 0;

  let title, sub, buttons;
  if(doneTodayStrength){
    title = 'Heute erledigt ✓';
    sub = `Tag ${info.day} von 7 — gute Arbeit.`;
    buttons = `<button class="btn secondary" data-action="start-cardio">Ausdauer loggen</button>`;
  } else if(scheduled && !doneVariants.has(scheduled)){
    title = PLAN[scheduled].name;
    sub = `Tag ${info.day} von 7 · heute laut Plan`;
    buttons = `<button class="btn" data-action="start-workout" data-variant="${scheduled}">Training starten</button>
      <div style="height:8px"></div>
      <button class="btn secondary" data-action="start-cardio">Ausdauer loggen</button>`;
  } else if(scheduled){
    title = `${PLAN[scheduled].name} bereits absolviert ✓`;
    sub = `Tag ${info.day} von 7`;
    buttons = (nextDue ? `<button class="btn" data-action="start-workout" data-variant="${nextDue}">${PLAN[nextDue].name} vorziehen</button><div style="height:8px"></div>` : '') +
      `<button class="btn secondary" data-action="start-cardio">Ausdauer loggen</button>`;
  } else {
    title = 'Restday';
    sub = `Tag ${info.day} von 7 · Regeneration${!cardioDone ? ' — guter Tag für deine Ausdauereinheit' : ''}`;
    buttons = !cardioDone
      ? `<button class="btn" data-action="start-cardio">Ausdauer loggen</button>`
      : `<button class="btn secondary" data-action="start-cardio">Ausdauer loggen</button>`;
    if(nextDue){
      buttons += `<div style="height:8px"></div><button class="btn secondary" data-action="start-workout" data-variant="${nextDue}">Krafttraining vorziehen (${nextDue})</button>`;
    }
  }

  return `
    <div class="card">
      <h2>${title}</h2>
      <div class="sub">${sub}</div>
      ${buttons}
    </div>
    <div class="card">
      <h2 class="cardlabel">Dein 7-Tage-Zyklus</h2>
      ${renderCycleStrip(info)}
    </div>
    <div class="card">
      <h2 class="cardlabel">Sätze pro Muskelgruppe · dieser Zyklus</h2>
      <div class="sub">Ist / Plan-Soll über alle drei Einheiten</div>
      ${renderVolume(info)}
    </div>
  `;
}

function renderCycleStrip(info){
  const cyc = sessionsInCycle(info.curStart);
  const cells = [];
  for(let i = 0; i < 7; i++){
    const date = addDays(info.curStart, i);
    const planned = SCHEDULE[i+1];
    const strengthHere = cyc.s.some(x => x.date === date);
    const cardioHere = cyc.c.some(x => x.date === date);
    const done = strengthHere || (planned === null && cardioHere);
    const today = date === todayISO();
    const future = date > todayISO();
    cells.push(`<div class="slot ${done ? 'done' : ''} ${today ? 'today' : ''} ${(future && !done) ? 'future' : ''}">
      <div class="big">${planned || '–'}</div>
      <div class="small">${weekdayShort(date)}</div>
    </div>`);
  }
  return `<div class="weekgrid">${cells.join('')}</div>
    <div class="cardiostatus">Ausdauer diesen Zyklus: ${cyc.c.length > 0 ? '<span class="ok">✓ erledigt</span>' : '– noch offen'}</div>`;
}

function renderVolume(info){
  const targets = planTargets();
  const vol = cycleVolume(info);
  return MUSCLES.map(m => {
    const v = vol[m] || 0, t = targets[m] || 0;
    const pct = t > 0 ? Math.min(100, (v/t)*100) : 0;
    return `<div class="vol-row">
      <div class="vol-label">${m}</div>
      <div class="vol-bar-bg"><div class="vol-bar-fill" style="width:${pct}%"></div></div>
      <div class="vol-count">${v}/${t}</div>
    </div>`;
  }).join('');
}

function renderWorkoutView(){
  const a = ACTIVE;
  return `
    <a href="#" class="backlink" data-action="cancel-active">✕ Abbrechen</a>
    <div class="card">
      <h2>${a.name}</h2>
      <div class="sub">${fmtDate(a.date)}</div>
    </div>
    ${TIMER.total > 0 ? renderTimer() : ''}
    ${a.exercises.map((ex, exi) => `
      <div class="exwrap">
        <div class="exname">${ex.name}</div>
        <input class="variantinput" type="text" placeholder="Deine Variante (z. B. Langhantel, Maschine …)" value="${esc(ex.variant || '')}" data-variant-exi="${exi}">
        ${ex.examples && ex.examples.length ? `<div class="examples">${ex.examples.map(x => `<button class="ex-chip" data-action="pick-example" data-exi="${exi}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
        <div class="exmeta">${ex.muscle} · Ziel ${ex.repMin}–${ex.repMax} ${ex.type === 'time' ? ex.unit : 'Wdh.'}</div>
        <div class="lastnote">${ex.suggestNote}</div>
        ${ex.sets.map((s, si) => ex.type === 'weight' ? `
          <div class="setrow">
            <div class="setnum">${si+1}</div>
            <input type="number" inputmode="decimal" placeholder="kg" value="${s.weight ?? ''}" data-set-field="weight" data-exi="${exi}" data-si="${si}">
            <input type="number" inputmode="numeric" placeholder="Wdh" value="${s.reps ?? ''}" data-set-field="reps" data-exi="${exi}" data-si="${si}">
            <button class="checkbtn ${s.done ? 'checked' : ''}" data-action="toggle-set" data-exi="${exi}" data-si="${si}">${s.done ? '✓' : ''}</button>
          </div>
        ` : `
          <div class="setrow single">
            <div class="setnum">${si+1}</div>
            <input type="number" inputmode="numeric" placeholder="${ex.unit}" value="${s.reps ?? ''}" data-set-field="reps" data-exi="${exi}" data-si="${si}">
            <button class="checkbtn ${s.done ? 'checked' : ''}" data-action="toggle-set" data-exi="${exi}" data-si="${si}">${s.done ? '✓' : ''}</button>
          </div>
        `).join('')}
        <div class="chiprow">
          <button class="chip" data-action="rest" data-secs="60">Pause 60s</button>
          <button class="chip" data-action="rest" data-secs="90">Pause 90s</button>
          <button class="chip" data-action="rest" data-secs="150">Pause 150s</button>
        </div>
      </div>
    `).join('')}
    <button class="btn" data-action="finish-workout">Training abschließen</button>
  `;
}

function renderTimer(){
  const circ = 2*Math.PI*26;
  const pct = TIMER.total > 0 ? TIMER.remaining/TIMER.total : 0;
  const mm = Math.floor(TIMER.remaining/60), ss = TIMER.remaining%60;
  return `
    <div class="timerwrap">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="var(--surface-2)" stroke-width="6"></circle>
        <circle id="timerRing" cx="32" cy="32" r="26" fill="none" stroke="var(--accent)" stroke-width="6"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" stroke-linecap="round"
          transform="rotate(-90 32 32)"></circle>
      </svg>
      <div>
        <div class="ttext" id="timerText">${mm}:${String(ss).padStart(2,'0')}</div>
        <div class="tlabel">Satzpause</div>
      </div>
    </div>
  `;
}

function renderCardioView(){
  const a = ACTIVE;
  return `
    <a href="#" class="backlink" data-action="cancel-active">✕ Abbrechen</a>
    <div class="card">
      <h2>Ausdauer</h2>
      <div class="sub">${fmtDate(a.date)}</div>

      <label class="field">Typ</label>
      <select data-cardio-field="type">
        ${['Laufen','Radfahren','Rudern','Crosstrainer','Schwimmen','Sonstiges'].map(t => `<option ${a.type === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>

      <label class="field">Dauer (Minuten)</label>
      <input type="number" inputmode="numeric" value="${a.duration}" data-cardio-field="duration">

      <label class="field">Distanz (km, optional)</label>
      <input type="text" inputmode="decimal" value="${esc(a.distance)}" data-cardio-field="distance" placeholder="z. B. 8.5">

      <label class="field">Belastung (RPE 1–10)</label>
      <input type="number" inputmode="numeric" min="1" max="10" value="${a.rpe}" data-cardio-field="rpe">
    </div>
    <button class="btn" data-action="finish-cardio">Einheit speichern</button>
  `;
}

function renderHistory(){
  const items = [
    ...DATA.sessions.map(s => ({...s, kind:'strength'})),
    ...DATA.cardioSessions.map(c => ({...c, kind:'cardio'}))
  ].sort((a,b) => b.date.localeCompare(a.date));
  if(items.length === 0) return `<div class="card"><div class="empty">Noch keine Einheiten geloggt.</div></div>`;
  return `<div class="card">
    ${items.map(it => {
      if(it.kind === 'strength'){
        return `<div class="histitem">
          <div class="hd"><span>${it.name}</span><span class="date">${fmtDate(it.date)}</span></div>
          <div class="detail">${it.exercises.map(ex => {
            const done = ex.sets.filter(s => s.done);
            if(done.length === 0) return '';
            const isWeight = ex.type ? ex.type === 'weight' : true;
            const setsStr = isWeight
              ? done.map(s => `${s.weight}kg×${s.reps}`).join(', ')
              : done.map(s => `${s.reps} ${ex.unit}`).join(', ');
            const varTxt = ex.variant ? ` — ${esc(ex.variant)}` : '';
            return `${ex.name}${varTxt}: ${setsStr}`;
          }).filter(Boolean).join('<br>')}</div>
        </div>`;
      } else {
        return `<div class="histitem">
          <div class="hd"><span>Ausdauer — ${esc(it.type)}</span><span class="date">${fmtDate(it.date)}</span></div>
          <div class="detail">${esc(it.duration)} Min${it.distance ? ` · ${esc(it.distance)} km` : ''} · RPE ${esc(it.rpe)}</div>
        </div>`;
      }
    }).join('')}
  </div>`;
}

function renderProgress(){
  const pbs = personalBests();
  const ids = Object.keys(pbs);
  return `
    <div class="card">
      <h2 class="cardlabel">Persönliche Bestleistungen</h2>
      <div class="sub">Bestwerte pro Bewegungsmuster (variantenübergreifend) · geschätztes 1RM nach Epley</div>
      ${ids.length === 0 ? '<div class="empty">Noch keine Daten.</div>' : `
      <table class="pbtable">
        ${ids.map(id => {
          const pb = pbs[id];
          return `<tr><td>${pb.name}<br><span style="color:var(--text-dim); font-size:11px;">${pb.sub ? pb.sub + ' · ' : ''}${fmtDate(pb.date)}</span></td><td>${pb.display}</td></tr>`;
        }).join('')}
      </table>`}
    </div>
    <div class="card">
      <h2 class="cardlabel">Gesamt</h2>
      <div class="sub">${DATA.sessions.length} Krafteinheiten · ${DATA.cardioSessions.length} Ausdauereinheiten · ${streakCycles()} Zyklen in Folge komplett</div>
    </div>
  `;
}

function renderDataView(){
  const info = cycleInfo();
  return `
    <div class="card">
      <h2>Zyklus</h2>
      <div class="sub">${info ? `Gestartet am ${fmtDate(DATA.cycleStart)} · heute Tag ${info.day} von 7` : 'Noch nicht gestartet — dein erstes abgeschlossenes Training wird Tag 1.'}</div>
      ${info ? `<button class="btn secondary" data-action="restart-cycle">Zyklus neu starten (heute = Tag 1)</button>` : ''}
    </div>
    <div class="card">
      <h2>Deine Daten</h2>
      <div class="sub">Alles wird ausschließlich lokal in diesem Browser gespeichert (localStorage). Es gibt keine Server-Verbindung — niemand außer dir hat Zugriff.</div>
      <button class="btn secondary" data-action="export">Backup exportieren (.json)</button>
      <div style="height:8px"></div>
      <label class="btn secondary" style="display:block; text-align:center; cursor:pointer;">
        Backup importieren
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </label>
      <div style="height:8px"></div>
      <button class="btn danger" data-action="reset-all">Alle Daten löschen</button>
    </div>
  `;
}

/* ============ EVENT HANDLING ============ */
function attachHandlers(){
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = () => setView(b.dataset.tab);
  });
  document.querySelectorAll('[data-action="start-workout"]').forEach(b => {
    b.onclick = () => startWorkout(b.dataset.variant);
  });
  document.querySelectorAll('[data-action="start-cardio"]').forEach(b => {
    b.onclick = startCardio;
  });

  const cancelLink = document.querySelector('[data-action="cancel-active"]');
  if(cancelLink) cancelLink.onclick = (e) => {e.preventDefault(); cancelActive();};

  document.querySelectorAll('[data-variant-exi]').forEach(inp => {
    inp.oninput = () => { ACTIVE.exercises[+inp.dataset.variantExi].variant = inp.value; };
  });
  document.querySelectorAll('[data-set-field]').forEach(inp => {
    inp.oninput = () => {
      const exi = +inp.dataset.exi, si = +inp.dataset.si, field = inp.dataset.setField;
      const val = inp.value === '' ? null : parseFloat(inp.value);
      ACTIVE.exercises[exi].sets[si][field] = val;
    };
  });
  document.querySelectorAll('[data-action="toggle-set"]').forEach(b => {
    b.onclick = () => {
      const exi = +b.dataset.exi, si = +b.dataset.si;
      const set = ACTIVE.exercises[exi].sets[si];
      set.done = !set.done;
      render();
    };
  });
  document.querySelectorAll('[data-action="rest"]').forEach(b => {
    b.onclick = () => startTimer(+b.dataset.secs);
  });
  document.querySelectorAll('[data-action="pick-example"]').forEach(b => {
    b.onclick = () => {
      const exi = +b.dataset.exi;
      ACTIVE.exercises[exi].variant = b.dataset.value;
      render();
    };
  });
  const finishBtn = document.querySelector('[data-action="finish-workout"]');
  if(finishBtn) finishBtn.onclick = finishWorkout;

  document.querySelectorAll('[data-cardio-field]').forEach(inp => {
    inp.oninput = () => { ACTIVE[inp.dataset.cardioField] = inp.value; };
  });
  const finishCardioBtn = document.querySelector('[data-action="finish-cardio"]');
  if(finishCardioBtn) finishCardioBtn.onclick = finishCardio;

  const restartBtn = document.querySelector('[data-action="restart-cycle"]');
  if(restartBtn) restartBtn.onclick = () => {
    if(confirm('Heute wird Tag 1 eines neuen Zyklus. Deine Historie bleibt erhalten. Fortfahren?')){
      DATA.cycleStart = todayISO();
      saveData();
      render();
      toast('Zyklus neu gestartet — heute ist Tag 1');
    }
  };

  const exportBtn = document.querySelector('[data-action="export"]');
  if(exportBtn) exportBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `training-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Backup heruntergeladen');
  };
  const importInput = document.querySelector('#importFile');
  if(importInput) importInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed.sessions) || !Array.isArray(parsed.cardioSessions)){ toast('Ungültige Backup-Datei'); return; }
        DATA = Object.assign({ sessions:[], cardioSessions:[], cycleStart:null, variants:{} }, parsed);
        saveData();
        toast('Backup importiert');
        render();
      }catch(err){ toast('Datei konnte nicht gelesen werden'); }
    };
    reader.readAsText(file);
  };
  const resetBtn = document.querySelector('[data-action="reset-all"]');
  if(resetBtn) resetBtn.onclick = () => {
    if(confirm('Wirklich ALLE Trainingsdaten unwiderruflich löschen?')){
      localStorage.removeItem(STORAGE_KEY);
      DATA = loadData();
      render();
      toast('Daten gelöscht');
    }
  };
}

render();

/* Offline-Fähigkeit: Der Service Worker (sw.js) legt die App im Browser-Cache ab,
   sodass sie nach dem ersten Öffnen auch ganz ohne Internet startet. */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
